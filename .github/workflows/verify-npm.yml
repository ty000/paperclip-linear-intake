name: Verify existing npm release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Original release.yml run ID (verification only)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify qualified release (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out trusted verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Validate original release and qualification
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
        run: node scripts/ci/verify-npm-run.mjs
      - name: Download the exact qualified artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          artifact-ids: ${{ steps.origin.outputs.artifact_id }}
          merge-multiple: true
          path: artifacts/package
          run-id: ${{ steps.origin.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Wait for exact package integrity and dist-tag
        env:
          ARCHIVE_DIRECTORY: artifacts/package
          PACKAGE_NAME: '@ty000/paperclip-linear-intake'
          RELEASE_TAG: ${{ steps.origin.outputs.release_tag }}
        run: node scripts/ci/verify-npm.mjs
