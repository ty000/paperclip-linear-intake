name: Repository CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap checks
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Check commit whitespace
        run: git show --format= --check HEAD

      - name: Check local Markdown links
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          missing = []
          for name in tracked:
              source = Path(name)
              if source.suffix != '.md':
                  continue
              for target in re.findall(r'\[[^\]]*\]\(([^\s)]+)\)', source.read_text()):
                  parsed = urlsplit(target)
                  if parsed.scheme or not parsed.path:
                      continue
                  if not (source.parent / unquote(parsed.path)).is_file():
                      missing.append(f'{source}: {target}')
          if missing:
              raise SystemExit('\n'.join(missing))
          print('Local Markdown links resolve.')
          PY

  package:
    name: Package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - name: Install from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck, build, SDK harness and worker RPC tests
        run: npm run check
      - name: Inspect package contents and record exact candidate
        env:
          BUILD_EVIDENCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          BUILD_EVIDENCE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          npm pack --dry-run --json
          node scripts/record-check.mjs
      - name: Save build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-build-evidence
          path: artifacts/build-evidence.json
          if-no-files-found: error

  fallow:
    name: Fallow
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FALLOW_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out exact candidate with audit history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Resolve comparison base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          case "$EVENT_NAME" in
            pull_request)
              audit_base="$PR_BASE_SHA"
              [[ "$audit_base" =~ ^[0-9a-f]{40}$ && "$audit_base" != 0000000000000000000000000000000000000000 ]]
              ;;
            push)
              audit_base="$PUSH_BEFORE_SHA"
              ;;
            workflow_dispatch)
              audit_base=""
              ;;
            *)
              echo 'Unsupported audit event' >&2
              exit 1
              ;;
          esac
          if [[ -z "$audit_base" || "$audit_base" == 0000000000000000000000000000000000000000 ]]; then
            audit_base=$(git merge-base HEAD "refs/remotes/origin/$DEFAULT_BRANCH")
            if [[ "$audit_base" == "$(git rev-parse HEAD)" ]]; then
              audit_base=$(git rev-parse HEAD^)
            fi
          fi
          [[ "$audit_base" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$audit_base^{commit}"
          echo "sha=$audit_base" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/fallow-ci
          git rev-parse HEAD > artifacts/fallow-ci/head.txt
          echo "$audit_base" > artifacts/fallow-ci/base.txt
          sha256sum package-lock.json .fallowrc.json > artifacts/fallow-ci/inputs.sha256
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - name: Install from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify pinned Fallow
        run: |
          node_modules/.bin/fallow --version > artifacts/fallow-ci/version.txt
          # The launcher appends a binary-attestation line; keep it as evidence.
          test "$(head -n 1 artifacts/fallow-ci/version.txt)" = 'fallow 3.23.0'
      - name: Build runtime imports before analysis
        run: npm run build
      - name: Audit introduced findings
        env:
          AUDIT_BASE: ${{ steps.base.outputs.sha }}
        run: |
          set +e
          npm run audit:static -- --base "$AUDIT_BASE" --output-file artifacts/fallow-ci/audit.json
          audit_exit=$?
          set -e
          printf '%s\n' "$audit_exit" > artifacts/fallow-ci/native-exit-code.txt
          node scripts/fallow-ci-gate.mjs artifacts/fallow-ci/audit.json "$audit_exit" \
            "$AUDIT_BASE" "$(git rev-parse HEAD)" > artifacts/fallow-ci/gate.json
      - name: Save static audit evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fallow-audit
          path: artifacts/fallow-ci/
          if-no-files-found: error

  postgres:
    name: PostgreSQL durability checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        # Official Docker image, same digest; avoid anonymous Docker Hub pull limits.
        image: public.ecr.aws/docker/library/postgres:18.1@sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f
        env:
          POSTGRES_USER: intake_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: intake_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intake_test -d intake_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INTAKE_TEST_DATABASE_URL: postgresql://intake_test:synthetic_ci_only@127.0.0.1:5432/intake_test
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - name: Install from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify durable SQL and restart boundaries
        shell: bash
        run: |
          mkdir -p artifacts/postgres-ci
          git rev-parse HEAD > artifacts/postgres-ci/candidate.txt
          sha256sum migrations/*.sql package-lock.json > artifacts/postgres-ci/inputs.sha256
          npm run test:postgres | tee artifacts/postgres-ci/tests.log
      - name: Save isolated PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgres-evidence
          path: artifacts/postgres-ci/
          if-no-files-found: error
